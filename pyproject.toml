[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentryip"
version = "0.1.0"
description = "Autonomous SOC/Blue Team AI Analyst for IP Investigation & Threat Intelligence"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SentryIP Team", email = "sec-ops@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Operating System :: OS Independent",
]
dependencies = [
    "anthropic>=0.34.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "ipwhois>=1.2.0",
    "dnspython>=2.6.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
sentryip = "sentryip.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentryip*"]

